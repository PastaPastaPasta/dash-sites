name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package the shell
        run: tar -C packages/shell/dist -czf dash-sites-shell.tar.gz .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            packages/extension/build/*.zip \
            packages/cli/bundle/dash-sites.mjs \
            packages/gateway/bundle/gateway.mjs \
            dash-sites-shell.tar.gz \
            packages/shell/dist/shell.json
