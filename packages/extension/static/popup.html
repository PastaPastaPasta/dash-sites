<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Dash Sites</title>
<link rel="stylesheet" href="ui.css">
<style>
body{width:330px}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
header img{width:20px;height:20px}
header b{flex:1;font-size:14px}
form{display:flex;gap:8px;padding:14px}
#chain{margin:0;padding:0 14px 12px;color:var(--muted);font-size:12.5px}
#chain b{color:var(--fg);font-weight:600}
footer{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header><img src="icons/48.png" alt=""><b>Dash Sites</b><span id="network" class="muted"></span></header>
<form id="open"><input type="text" id="name" placeholder="alice.dash" autocapitalize="none" spellcheck="false" aria-label="Open a .dash name"><button>Open</button></form>
<p id="chain"></p>
<footer><span>Or type <code>alice.dash/</code> in the address bar</span><a id="options">Settings</a></footer>
<script type="module" src="popup.js"></script>
</body>
</html>
